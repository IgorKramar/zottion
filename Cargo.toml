[workspace]
members = [".", "auth-service"]
resolver = "2"

[package]
name = "zottion"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Igor Kramar"]
license = "MIT"
description = "Notion TUI and CLI with durable drafts"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
dirs = "6"
edtui = { version = "=0.11.7", default-features = false, features = ["mouse-support"] }
fs2 = "0.4"
futures-util = "0.3"
keyring = { version = "4.2", features = ["v1"] }
ratatui = { version = "=0.30.0", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
webbrowser = "1"

# Linux: level-triggered input preserves keys arriving with SIGWINCH.
# macOS keeps the previously verified Mio backend.
[target.'cfg(target_os = "linux")'.dependencies]
crossterm = { version = "=0.29.0", features = ["use-dev-tty"] }

[dev-dependencies]
tempfile = "3"
