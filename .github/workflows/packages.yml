name: packages
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.0 --profile minimal --target ${{ matrix.target }}
      - run: cargo +1.91.0 build --workspace --release --locked --target ${{ matrix.target }}
      - run: python3 scripts/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: zottion-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
