[package]
name = "zottion-auth-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Igor Kramar"]
license = "MIT"
description = "One-time OAuth handoff service for zottion"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
